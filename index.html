<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Supply &amp; Demand Zone Rules</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e13;
    --panel:#121922;
    --panel-hover:#161f2b;
    --border:#232f3b;
    --border-active:#2f4a3f;
    --text:#e7ecef;
    --text-dim:#7c8894;
    --text-faint:#48525c;
    --green:#22c55e;
    --green-glow:rgba(34,197,94,.32);
    --amber:#f5a623;
    --amber-dim:rgba(245,166,35,.12);
    --mid:#38bdf8;
    --mid-glow:rgba(56,189,248,.32);
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --sans:'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background-color:var(--bg);
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size:28px 28px;
    color:var(--text);
    font-family:var(--sans);
    display:flex;
    justify-content:center;
    padding:32px 16px 64px;
    -webkit-font-smoothing:antialiased;
  }
  .card{ width:100%; max-width:460px; }
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin:0 0 10px;
  }
  h1{
    font-size:26px;
    font-weight:800;
    letter-spacing:-.01em;
    margin:0 0 6px;
  }
  .subhead{
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-faint);
    margin:0 0 28px;
  }

  .sequence{ position:relative; }

  .step{ display:flex; gap:14px; align-items:stretch; }

  .rail{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:28px;
    flex-shrink:0;
  }
  .node{
    width:28px;
    height:28px;
    border-radius:50%;
    border:2px solid var(--border);
    background:var(--panel);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--mono);
    font-size:11px;
    font-weight:600;
    color:var(--text-faint);
    flex-shrink:0;
    transition:all .25s ease;
    z-index:1;
  }
  .node.on{
    background:var(--green);
    border-color:var(--green);
    color:#0a0e13;
    box-shadow:0 0 0 4px var(--green-glow);
  }
  .node.warn{
    background:var(--mid);
    border-color:var(--mid);
    color:#0a0e13;
    box-shadow:0 0 0 4px var(--mid-glow);
  }
  .node svg{ width:14px; height:14px; display:none; }
  .node.on svg, .node.warn svg{ display:block; }
  .node.on .num, .node.warn .num{ display:none; }

  .connector{
    width:2px;
    flex:1;
    background:var(--border);
    margin:2px 0;
    transition:background .3s ease;
  }
  .connector.on{ background:var(--green); }
  .connector.warn{ background:var(--mid); }

  .step-body{ flex:1; padding-bottom:20px; cursor:pointer; }
  .step-panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 16px;
    transition:border-color .2s ease, background .2s ease, transform .15s ease;
  }
  .step-body:hover .step-panel{
    background:var(--panel-hover);
    border-color:#2b3945;
  }
  .step-body:active .step-panel{ transform:scale(.99); }
  .step-body.checked .step-panel{ border-color:var(--border-active); }

  .step-title{
    font-size:15px;
    font-weight:700;
    margin:0 0 4px;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .step-title .frac{
    font-family:var(--mono);
    font-size:11px;
    font-weight:500;
    color:var(--text-faint);
  }
  .step-desc{
    font-size:13.5px;
    line-height:1.5;
    color:var(--text-dim);
    margin:0;
  }
  .step-note{
    font-family:var(--mono);
    font-size:11px;
    color:var(--mid);
    margin:8px 0 0;
  }

  .gate{ display:flex; gap:14px; align-items:stretch; margin-top:2px; }
  .gate-node{
    width:28px;
    height:28px;
    border-radius:50%;
    border:2px solid var(--amber);
    background:var(--amber-dim);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    transition:all .3s ease;
  }
  .gate-node svg{ width:14px; height:14px; stroke:var(--amber); transition:stroke .3s ease; }
  .gate-node.cleared{
    border-color:var(--green);
    background:var(--green);
    box-shadow:0 0 0 4px var(--green-glow);
  }
  .gate-node.cleared svg{ stroke:#0a0e13; }
  .gate-node.medium{
    border-color:var(--mid);
    background:var(--mid);
    box-shadow:0 0 0 4px var(--mid-glow);
  }
  .gate-node.medium svg{ stroke:#0a0e13; }

  .gate-panel{
    flex:1;
    border:1px solid var(--amber);
    background:var(--amber-dim);
    border-radius:10px;
    padding:14px 16px;
    transition:all .3s ease;
  }
  .gate-panel.cleared{
    border-color:var(--green);
    background:rgba(34,197,94,.08);
    animation:pulse 2.2s ease-in-out infinite;
  }
  .gate-panel.medium{
    border-color:var(--mid);
    background:rgba(56,189,248,.08);
    animation:pulse-mid 2.2s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){
    .gate-panel.cleared, .gate-panel.medium{ animation:none; }
  }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 0 var(--green-glow); }
    50%{ box-shadow:0 0 14px 2px var(--green-glow); }
  }
  @keyframes pulse-mid{
    0%,100%{ box-shadow:0 0 0 0 var(--mid-glow); }
    50%{ box-shadow:0 0 14px 2px var(--mid-glow); }
  }
  .gate-status{
    font-family:var(--mono);
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--amber);
    margin:0 0 2px;
    transition:color .3s ease;
  }
  .gate-panel.cleared .gate-status{ color:var(--green); }
  .gate-panel.medium .gate-status{ color:var(--mid); }
  .gate-sub{ font-size:12.5px; color:var(--text-dim); margin:0; }

  .reset{
    display:block;
    width:100%;
    text-align:center;
    margin-top:22px;
    background:none;
    border:none;
    font-family:var(--mono);
    font-size:11.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-faint);
    cursor:pointer;
    padding:8px;
  }
  .reset:hover{ color:var(--text-dim); text-decoration:underline; }

  .loading{
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-faint);
    padding:20px 2px;
    margin:0;
  }
  .save-note{
    text-align:center;
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--text-faint);
    height:14px;
    margin:10px 0 0;
    opacity:0;
    transition:opacity .3s ease;
  }
  .save-note.show{ opacity:1; }
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">ICT / SMC &middot; Step 3 back-up</p>
    <h1>Supply &amp; Demand Rules</h1>
    <p class="subhead">Zone validity check &mdash; before it earns the tag</p>

    <div class="sequence" id="sequence">
      <p class="loading" id="loadingMsg">Loading your progress&hellip;</p>
    </div>
  </div>

<script>
const steps = [
  {
    title: "Did price leave fast?",
    tag: "Departure",
    desc: "Price must leave the zone with a strong move."
  },
  {
    title: "Was the pause/base short?",
    tag: "Base",
    desc: "Few base candles is much better."
  },
  {
    title: "Has price touched it before?",
    tag: "Freshness",
    desc: "The best zone has zero touches \u2014 the first return is the strongest.",
    warning: true
  },
  {
    title: "Is there room to profit?",
    tag: "Profit Margin",
    desc: "There must be open space before the next opposing zone."
  },
  {
    title: "Does price come back clearly?",
    tag: "Arrival",
    desc: "Price should come back to the zone in a clean direction."
  }
];

let state = steps.map(() => false);
const STORAGE_KEY = 'supply-demand-progress';
let saveTimer = null;

async function loadState(){
  try{
    const result = await window.storage.get(STORAGE_KEY, false);
    if(result && result.value){
      const parsed = JSON.parse(result.value);
      if(Array.isArray(parsed) && parsed.length === steps.length){
        state = parsed;
      }
    }
  }catch(e){
    // no saved progress yet, first time opening on this device
  }
  render();
}

async function saveState(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
    flashSaved();
  }catch(e){
    console.error('Could not save progress', e);
  }
}

function flashSaved(){
  const note = document.getElementById('saveNote');
  if(!note) return;
  note.classList.add('show');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => note.classList.remove('show'), 1200);
}

const checkIcon = `<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
const lockIcon = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="1"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>`;

const seqEl = document.getElementById('sequence');

function render(){
  let html = '';
  steps.forEach((s, i) => {
    const on = state[i];
    const colorClass = on ? (s.warning ? 'warn' : 'on') : '';
    html += `
      <div class="step">
        <div class="rail">
          <div class="node ${colorClass}">
            <span class="num">${String(i+1).padStart(2,'0')}</span>
            ${checkIcon}
          </div>
          <div class="connector ${colorClass}"></div>
        </div>
        <div class="step-body ${on ? 'checked' : ''}" data-idx="${i}">
          <div class="step-panel">
            <p class="step-title">${s.title} <span class="frac">${s.tag}</span></p>
            <p class="step-desc">${s.desc}</p>
            ${s.warning ? `<p class="step-note">Doesn't block the zone \u2014 downgrades it to medium if checked.</p>` : ''}
          </div>
        </div>
      </div>
    `;
  });

  const requiredIdx = [0, 1, 3, 4]; // rules 1, 2, 4, 5 — freshness (idx 2) never blocks
  const requiredCount = requiredIdx.filter(i => state[i]).length;
  const requiredMet = requiredCount === requiredIdx.length;
  const touchedBefore = state[2];

  let gateClass = '';
  let statusText = 'Zone incomplete';
  let subText = `${requiredCount}/${requiredIdx.length} required confirmed`;

  if(requiredMet){
    if(touchedBefore){
      gateClass = 'medium';
      statusText = 'Valid zone \u2014 repeat touch';
      subText = 'Required rules confirmed \u2014 already touched once, weaker return.';
    } else {
      gateClass = 'cleared';
      statusText = 'Valid zone \u2014 fresh';
      subText = 'Required rules confirmed \u2014 zero touches, first return.';
    }
  }

  html += `
    <div class="gate">
      <div class="gate-node ${gateClass}">
        ${gateClass ? checkIcon : lockIcon}
      </div>
      <div class="gate-panel ${gateClass}">
        <p class="gate-status">${statusText}</p>
        <p class="gate-sub">${subText}</p>
      </div>
    </div>
    <button class="reset" id="resetBtn">Reset for next zone</button>
    <p class="save-note" id="saveNote">Saved</p>
  `;

  seqEl.innerHTML = html;

  seqEl.querySelectorAll('.step-body').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.getAttribute('data-idx'), 10);
      state[idx] = !state[idx];
      render();
      saveState();
    });
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    state = steps.map(() => false);
    render();
    saveState();
  });
}

loadState();
</script>
</body>
</html>
